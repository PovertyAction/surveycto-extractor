name: Pre-commit

on:
  # `dev` is the integration branch: feature work is gated there before a single
  # dev -> main review. Without `dev` here, a PR into dev would get the ci.yml
  # test matrix (its `pull_request:` is unfiltered) but skip the hooks entirely,
  # which would make the gate we moved to dev weaker than the one on main.
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync (all extras)
        run: uv sync --locked --all-extras
      # Run pre-commit via uv (pre-commit is in the dev extra). Avoids
      # pre-commit/action's `python -m pip install`, which fails against the
      # pip-less uv venv that setup-uv activates.
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Lives here rather than in ci.yml: this job already syncs --all-extras
      # (sweep 3 imports the optional mcp extra) and runs ONCE, whereas ci.yml
      # would repeat it across all 11 matrix jobs for no extra signal.
      - name: Repo integrity sweeps
        run: uv run python scripts/integrity_check.py
