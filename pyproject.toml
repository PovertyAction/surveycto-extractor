[project]
name = "surveycto-extractor"
version = "0.1.0"
description = "Toolkit for extracting SurveyCTO instrument structure and generating Stata-ready outputs, docs, and a variable dictionary."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.0,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1.5,<4",
    "pyreadstat>=1.2.0,<2",
    "pyarrow>=15.0.0",
    "networkx>=3.0,<4",
    # PII classification. spaCy models are installed per project (see pii.py);
    # model wheels declare no dependencies, so spaCy is pinned to the 3.8 models.
    "presidio-analyzer>=2.2,<3",
    "spacy>=3.8,<3.9",
    # The survey-expert MCP server, the skill's first way in.
    "mcp[cli]>=2.0.0,<3",
    "tomli>=2.0.1; python_version < '3.11'",  # config.toml parsing (tomllib is stdlib on 3.11+)
]

[dependency-groups]
# en-core-web-sm: the small English model the PII tests and the sample run use.
dev = ["pytest", "ruff", "codespell", "pre-commit", "en-core-web-sm"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
surveycto-extract       = "surveycto_extractor.cli.extract:main"
surveycto-vardict       = "surveycto_extractor.cli.vardict:main"
surveycto-summary-stats = "surveycto_extractor.cli.summary_stats:main"
surveycto-init          = "surveycto_extractor.cli.init:main"
surveycto-skill         = "surveycto_extractor.cli.skill:main"
surveycto-mcp           = "surveycto_extractor.mcp_server.survey_server:main"
surveycto-survey        = "surveycto_extractor.survey:main"
surveycto-links         = "surveycto_extractor.flow:links_main"
surveycto-flow          = "surveycto_extractor.flow:flow_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/surveycto_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linting/formatting config adopted from ipa-python-template (org standard).
# Deviation: target-version stays py310 (this repo supports 3.10+, CI matrix
# 3.10-3.13) rather than the template's py312, so ruff/pyupgrade never emit
# 3.11/3.12-only rewrites.
[tool.ruff]
line-length = 88
fix = true
target-version = "py310"

[tool.ruff.lint]
# docs: https://docs.astral.sh/ruff/rules/
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "D",   # flake8-docstrings
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    # do not enable if formatting
    # docs: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab indentation
    "E111",   # indentation
    "E114",   # indentation
    "E117",   # over indented
    "D206",   # indent with spaces
    "D300",   # triple single quotes
    "E501",   # line length regulated by formatter
    "D105",   # missing docstring in magic method
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "SIM110", # Use all instead of `for` loop
    "TRY003", # Avoid specifying long messages outside the exception class
    "D205",   # 1 blank line required between summary line and description
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
# Test functions/classes/methods are self-documenting by name; don't require
# docstrings on them.
"tests/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
# jupyter/ipa from the template; the rest are domain terms / short identifiers /
# valid words in this codebase, not typos: anc=ancestors, lits=literals,
# missings=(stats plural), fallow=(uncultivated land, a plot status),
# unparseable=(valid variant), master=(master seed RNG / "master" questions file),
# fo=form_order local, iff=(if-and-only-if), falsy=(programming term),
# ws=(openpyxl worksheet), stdio=(standard I/O), whitelist/blacklist=(the [pii]
# config keys, shared with surveycto-python-dict).
ignore-words-list = "jupyter,ipa,anc,lits,missings,fallow,unparseable,master,fo,iff,falsy,ws,stdio,fillin,lets,whitelist,whitelisted,blacklist,blacklisted"
skip = "uv.lock,*.dta,*.parquet,*.xlsx"
